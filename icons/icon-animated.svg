<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Minesweeper</title>
  <style>
  .pole,.fl,.burst,.cf,.flag{transform-box:fill-box}
  .flag{transform-origin:50% 100%;animation:flag 6s ease-in-out infinite}
  .pole{transform-origin:50% 100%;animation:pole 6s ease-out infinite}
  .fl{transform-origin:0% 50%;animation:unfurl 6s ease-out infinite}
  .burst{transform-origin:50% 100%;animation:burst 6s ease-out infinite}
  .cf{transform-origin:50% 50%;animation:cf 6s ease-out infinite;opacity:0}
  @keyframes pole{0%,8%{transform:scaleY(0)}18%,100%{transform:scaleY(1)}}
  @keyframes unfurl{0%,14%{transform:scaleX(0)}27%,100%{transform:scaleX(1)}}
  @keyframes flag{0%,59%{transform:none;opacity:1}63%{transform:translate(-4px,-26px) rotate(-12deg)}86%{transform:translate(-10px,-34px) rotate(-14deg);opacity:1}92%,100%{transform:translate(-10px,-34px) rotate(-14deg);opacity:0}}
  @keyframes burst{0%,59%{transform:scale(.15);opacity:0}62%{opacity:1}66%{transform:scale(1);opacity:1}84%{transform:scale(1.04);opacity:.9}92%,100%{transform:scale(1.1);opacity:0}}
  @keyframes cf{0%,60%{transform:translate(0,0) rotate(0);opacity:0}62%{opacity:1}88%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:1}95%,100%{transform:translate(var(--dx),calc(var(--dy) + 30px)) rotate(var(--r));opacity:0}}
</style>
  <defs>
    <clipPath id="sky"><rect x="72" y="72" width="368" height="368" rx="62"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="124" fill="#ff7b5c"/>
  <rect x="46" y="46" width="420" height="420" rx="96" fill="#ffb700"/>
  <rect x="72" y="72" width="368" height="368" rx="62" fill="#90e0f4"/>
  <g clip-path="url(#sky)">
    <path d="M72 215 Q110 190 150 205 Q175 215 200 232 Q240 250 290 240 Q330 232 345 262 Q352 300 335 352 L72 352 Z" fill="#d3f1f8"/>
    <path d="M300 118 Q330 98 360 112 Q380 100 405 112 L440 112 L440 138 L300 138 Z" fill="#c4ebf6"/>
    <path class="burst" d="M256 215 L282 262 L336 232 L322 285 L392 288 L340 322 L380 352 L256 352 L132 352 L172 322 L120 288 L190 285 L176 232 L230 262 Z" fill="#fff"/>
    <g class="flag">
      <rect class="pole" x="222" y="200" width="16" height="146" rx="3" fill="#eb5e3f"/>
      <rect x="216" y="338" width="28" height="14" rx="4" fill="#eb5e3f"/>
      <g class="fl"><path d="M238 206 L348 247 L238 290 Z" fill="#ff6b48"/></g>
    </g>
    <rect class="cf" x="150" y="190" width="22" height="9" rx="2" fill="#e0477a" style="--dx:-60px;--dy:-70px;--r:-120deg;animation-delay:0.000s"/>
    <rect class="cf" x="205" y="150" width="22" height="9" rx="2" fill="#4e5cff" style="--dx:-30px;--dy:-90px;--r:140deg;animation-delay:0.012s"/>
    <rect class="cf" x="300" y="170" width="22" height="9" rx="2" fill="#ffc107" style="--dx:50px;--dy:-80px;--r:100deg;animation-delay:0.024s"/>
    <rect class="cf" x="350" y="215" width="22" height="9" rx="2" fill="#e0477a" style="--dx:80px;--dy:-40px;--r:-90deg;animation-delay:0.036s"/>
    <rect class="cf" x="120" y="250" width="22" height="9" rx="2" fill="#00a884" style="--dx:-80px;--dy:-30px;--r:150deg;animation-delay:0.048s"/>
    <rect class="cf" x="172" y="300" width="22" height="9" rx="2" fill="#ffc107" style="--dx:-70px;--dy:10px;--r:-110deg;animation-delay:0.060s"/>
    <rect class="cf" x="370" y="290" width="22" height="9" rx="2" fill="#4e5cff" style="--dx:70px;--dy:20px;--r:120deg;animation-delay:0.072s"/>
    <rect class="cf" x="255" y="125" width="22" height="9" rx="2" fill="#ff8a65" style="--dx:10px;--dy:-100px;--r:-60deg;animation-delay:0.084s"/>
    <rect class="cf" x="330" y="130" width="22" height="9" rx="2" fill="#00a884" style="--dx:60px;--dy:-85px;--r:160deg;animation-delay:0.096s"/>
    <rect class="cf" x="110" y="330" width="22" height="9" rx="2" fill="#ff8a65" style="--dx:-60px;--dy:30px;--r:-70deg;animation-delay:0.108s"/>
    <rect class="cf" x="400" y="170" width="22" height="9" rx="2" fill="#ffc107" style="--dx:85px;--dy:-60px;--r:70deg;animation-delay:0.120s"/>
    <rect class="cf" x="215" y="230" width="22" height="9" rx="2" fill="#e0477a" style="--dx:-25px;--dy:-55px;--r:-150deg;animation-delay:0.132s"/>
    <path d="M72 352 H440 V440 H72 Z" fill="#009879"/>
  </g>
</svg>
